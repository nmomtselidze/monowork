[project]
name = "trip-planner-crew"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nodar", email = "nodar.m/cybx.io" }
]
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.15.22",
    "google-generativeai>=0.8.6",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "litellm>=1.102.1",
    "python-dotenv>=1.2.3",
    "unstructured>=0.27.8",
]

[project.scripts]
trip-planner-crew = "trip_planner_crew:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
