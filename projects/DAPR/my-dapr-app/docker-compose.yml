version: '3.8'
services:
  # 1. Redis (Our message broker)
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  # 2. The Order Processor App
  processor:
    build: ./processor
    ports:
      - "6001:6001"
    depends_on:
      - redis

  # 3. The Processor's Dapr Sidecar
  processor-dapr:
    image: "daprio/daprd:latest"
    command: [
      "./daprd",
      "-app-id", "processor",
      "-app-port", "6001",
      "-components-path", "/components"
    ]
    volumes:
      - "./components:/components"
    depends_on:
      - processor
    network_mode: "service:processor"

  # 4. The Checkout App (Publisher)
  checkout:
    build: ./checkout
    depends_on:
      - redis

  # 5. The Checkout's Dapr Sidecar
  checkout-dapr:
    image: "daprio/daprd:latest"
    command: [
      "./daprd",
      "-app-id", "checkout",
      "-components-path", "/components"
    ]
    volumes:
      - "./components:/components"
    depends_on:
      - checkout
    network_mode: "service:checkout"
