apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-backend
  labels:
    app: scheduler-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-backend
  template:
    metadata:
      labels:
        app: scheduler-backend
    spec:
      containers:
        - name: backend
          image: scheduler-backend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SCHED_DB_HOST
              value: postgres
            - name: SCHED_DB_PORT
              value: "5432"
            - name: SCHED_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SCHED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SCHED_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: SCHED_API_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
