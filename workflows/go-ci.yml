name: Go CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - harness2_engineering/harness_engineering_go/harness_engineering
          - adk_production/my_agent
          - kafka-go-project
          - nexus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: ${{ !env.ACT }}
          cache-dependency-path: "**/go.sum"

      - name: Install and run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest

    needs: lint

    strategy:
      fail-fast: false
      matrix:
        module:
          - harness2_engineering/harness_engineering_go/harness_engineering
          - adk_production/my_agent
          - kafka-go-project
          - nexus

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27
          cache: ${{ !env.ACT }}
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...


  build:
    name: Build (${{ matrix.module }})
    runs-on: ubuntu-latest

    needs: test

    strategy:
      fail-fast: false
      matrix:
        module:
          - harness2_engineering/harness_engineering_go/harness_engineering
          - adk_production/my_agent
          - kafka-go-project
          - nexus

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.GO_VERSION }}
          cache: ${{ !env.ACT }}
          cache-dependency-path: "**/go.sum"

      - name: Build
        run: go build ./...
